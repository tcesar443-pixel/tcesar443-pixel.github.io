<text x="334" y="685" text-anchor="middle" fill="#f1eadb" font-family="Georgia,serif" font-size="55" font-weight="700">PSICOLOGIA</text>
<text x="334" y="747" text-anchor="middle" fill="#f1eadb" font-family="Georgia,serif" font-size="55" font-weight="700">DO INVESTIMENTO</text>
<text x="334" y="798" text-anchor="middle" fill="#d0b16a" font-family="Arial,sans-serif" font-size="19" letter-spacing="1.2">A MENTE, O DINHEIRO E AS DECISÕES</text>
<text x="334" y="828" text-anchor="middle" fill="#d0b16a" font-family="Arial,sans-serif" font-size="19" letter-spacing="1.2">QUE CONSTROEM PATRIMÔNIO</text>
<line x1="170" y1="875" x2="498" y2="875" stroke="#8f6b34"/>
<text x="334" y="912" text-anchor="middle" fill="#b99a58" font-family="Georgia,serif" font-size="15" font-style="italic">“A riqueza adquirida às pressas diminuirá;</text>
<text x="334" y="934" text-anchor="middle" fill="#b99a58" font-family="Georgia,serif" font-size="15" font-style="italic">mas quem a ajunta pouco a pouco terá aumento.”</text>
<text x="334" y="956" text-anchor="middle" fill="#8f6b34" font-family="Arial,sans-serif" font-size="12">PROVÉRBIOS 13:11</text>
