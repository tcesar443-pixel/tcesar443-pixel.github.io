name: Finalizar endereco oficial do site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-site-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar URLs e SEO
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_urls = [
              'https://tcesar443-pixel.github.io',
              'https://thiagomurro-pixel.github.io',
          ]
          new_url = 'https://thiagomurro.github.io'
          text_exts = {'.html', '.txt', '.md', '.xml', '.webmanifest', '.js', '.css'}

          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts:
                  continue
              if p.suffix.lower() not in text_exts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              for old in old_urls:
                  s = s.replace(old, new_url)
              if s != original:
                  p.write_text(s, encoding='utf-8')

          robots = '''User-agent: *\nAllow: /\n\nSitemap: https://thiagomurro.github.io/sitemap.xml\n'''
          Path('robots.txt').write_text(robots, encoding='utf-8')

          pages = [
              ('https://thiagomurro.github.io/', '1.0'),
              ('https://thiagomurro.github.io/biografia.html', '0.9'),
              ('https://thiagomurro.github.io/livro.html', '0.9'),
              ('https://thiagomurro.github.io/palestras.html', '0.8'),
              ('https://thiagomurro.github.io/imprensa.html', '0.7'),
              ('https://thiagomurro.github.io/links.html', '0.7'),
              ('https://thiagomurro.github.io/contato.html', '0.7'),
          ]
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
          ]
          for loc, priority in pages:
              lines += [
                  '  <url>',
                  f'    <loc>{loc}</loc>',
                  '    <lastmod>2026-10-02</lastmod>',
                  f'    <priority>{priority}</priority>',
                  '  </url>',
              ]
          lines.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Confirmar ausencia do endereco antigo
        shell: bash
        run: |
          if grep -R -n --exclude-dir=.git --exclude-dir=.github -E 'tcesar443-pixel\.github\.io|thiagomurro-pixel\.github\.io' .; then
            echo 'Ainda existem referencias antigas.'
            exit 1
          fi

      - name: Publicar ajustes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html biografia.html livro.html palestras.html imprensa.html links.html contato.html 404.html robots.txt sitemap.xml site.webmanifest README.md script.js styles.css 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao pendente.'
            exit 0
          fi
          git commit -m 'SEO: atualiza endereco oficial para thiagomurro.github.io'
          git push origin HEAD:main

# execucao final apos renomeacao do repositorio
